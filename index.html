<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d88ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <title>Politics</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #18191a;
      color: #e4e6eb;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 450px; }
    h2 { text-align: center; margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 12px; font-size: 16px; font-weight: bold;
      border: none; border-radius: 8px; background-color: #242526;
      color: #b0b3b8; cursor: pointer;
    }
    .tab-btn.active { background-color: #2d88ff; color: white; }
    .card {
      background-color: #242526; padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .hidden { display: none; }
    input[type="text"] {
      width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 20px;
      border-radius: 8px; border: 1px solid #3a3b3c; background-color: #3a3b3c;
      color: white; font-size: 16px;
    }
    .spectrum-display {
      text-align: center; font-size: 32px; font-weight: bold;
      margin: 15px 0 20px 0; color: #2d88ff;
    }
    input[type="range"] {
      width: 100%; margin: 10px 0; accent-color: #2d88ff; height: 8px;
    }
    .scale-markers {
      display: flex; justify-content: space-between; font-size: 12px;
      color: #b0b3b8; margin-bottom: 25px;
    }
    .save-btn {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold;
      background-color: #42b72a; color: white; border: none;
      border-radius: 8px; cursor: pointer;
    }
    .save-btn:active { opacity: 0.85; }
    .average-box {
      background-color: #3a3b3c; padding: 15px; border-radius: 8px;
      text-align: center; margin-bottom: 20px;
    }
    .average-label { font-size: 28px; font-weight: bold; color: #42b72a; margin: 5px 0; }
    .history-list { list-style: none; padding: 0; margin: 0; }
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border-bottom: 1px solid #3a3b3c;
    }
    .history-item:last-child { border-bottom: none; }
    .item-info { display: flex; flex-direction: column; }
    .item-title { font-weight: bold; font-size: 15px; }
    .item-time { font-size: 12px; color: #b0b3b8; }
    .item-score { font-size: 15px; font-weight: bold; color: #2d88ff; margin-right: 12px; }
    .delete-btn {
      background: #e41e3f; color: white; border: none; border-radius: 6px;
      padding: 6px 10px; cursor: pointer; font-size: 12px;
    }
    .clear-all-btn {
      width: 100%; margin-top: 15px; padding: 10px; background-color: transparent;
      border: 1px solid #e41e3f; color: #e41e3f; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Politics</h2>

    <div class="tabs">
      <button id="rateTabBtn" class="tab-btn active" onclick="switchTab('rate')">Rate Answer</button>
      <button id="historyTabBtn" class="tab-btn" onclick="switchTab('history')">History (<span id="countBadge">0</span>)</button>
    </div>

    <div id="rateSection" class="card">
      <input type="text" id="noteInput" placeholder="Name or Question (optional)...">
      <div class="spectrum-display" id="spectrumDisplay">Center</div>
      <input type="range" id="ratingSlider" min="1" max="7" value="4" oninput="updateSlider(this.value)">
      <div class="scale-markers">
        <span>Far Left</span>
        <span>Center</span>
        <span>Far Right</span>
      </div>
      <button class="save-btn" onclick="saveRating()">Save Rating</button>
    </div>

    <div id="historySection" class="card hidden">
      <div class="average-box">
        <div style="font-size: 14px; color: #b0b3b8;">Overall Average</div>
        <div class="average-label" id="averageDisplay">-</div>
        <div style="font-size: 12px; color: #b0b3b8;" id="totalCountText">0 responses saved</div>
      </div>
      <ul class="history-list" id="historyList"></ul>
      <button class="clear-all-btn" onclick="clearAllHistory()">Clear All History</button>
    </div>
  </div>

  <script>
    const spectrumLabels = {
      1: "Far Left", 2: "Left", 3: "Lean Left", 4: "Center",
      5: "Lean Right", 6: "Right", 7: "Far Right"
    };

    let ratingsHistory = JSON.parse(localStorage.getItem("politicsSpectrumRatings")) || [];

    function updateSlider(val) {
      document.getElementById("spectrumDisplay").innerText = spectrumLabels[val];
    }

    function saveRating() {
      const score = parseInt(document.getElementById("ratingSlider").value);
      const labelName = spectrumLabels[score];
      const noteText = document.getElementById("noteInput").value.trim();
      const title = noteText !== "" ? noteText : `Response #${ratingsHistory.length + 1}`;
      const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      ratingsHistory.unshift({ id: Date.now(), title, score, label: labelName, time: timeString });
      localStorage.setItem("politicsSpectrumRatings", JSON.stringify(ratingsHistory));

      document.getElementById("noteInput").value = "";
      document.getElementById("ratingSlider").value = 4;
      updateSlider(4);
      updateHistoryUI();

      const btn = document.querySelector(".save-btn");
      btn.innerText = "Saved! ✓";
      setTimeout(() => { btn.innerText = "Save Rating"; }, 800);
    }

    function updateHistoryUI() {
      document.getElementById("countBadge").innerText = ratingsHistory.length;
      document.getElementById("totalCountText").innerText = `${ratingsHistory.length} responses saved`;
      const listEl = document.getElementById("historyList");
      listEl.innerHTML = "";

      if (ratingsHistory.length === 0) {
        document.getElementById("averageDisplay").innerText = "-";
        listEl.innerHTML = "<li style='text-align:center; color:#b0b3b8; padding:15px;'>No ratings saved yet.</li>";
        return;
      }

      let sum = ratingsHistory.reduce((acc, item) => acc + item.score, 0);
      const avgNum = sum / ratingsHistory.length;
      const avgLabel = spectrumLabels[Math.round(avgNum)];
      document.getElementById("averageDisplay").innerText = `${avgLabel} (${avgNum.toFixed(1)} / 7)`;

      ratingsHistory.forEach(item => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.innerHTML = `
          <div class="item-info">
            <span class="item-title">${item.title}</span>
            <span class="item-time">${item.time}</span>
          </div>
          <div style="display:flex; align-items:center;">
            <span class="item-score">${item.label}</span>
            <button class="delete-btn" onclick="deleteItem(${item.id})">X</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function deleteItem(id) {
      ratingsHistory = ratingsHistory.filter(item => item.id !== id);
      localStorage.setItem("politicsSpectrumRatings", JSON.stringify(ratingsHistory));
      updateHistoryUI();
    }

    function clearAllHistory() {
      if (confirm("Are you sure you want to delete all saved ratings?")) {
        ratingsHistory = [];
        localStorage.setItem("politicsSpectrumRatings", JSON.stringify(ratingsHistory));
        updateHistoryUI();
      }
    }

    function switchTab(tab) {
      document.getElementById("rateSection").classList.toggle("hidden", tab !== 'rate');
      document.getElementById("historySection").classList.toggle("hidden", tab !== 'history');
      document.getElementById("rateTabBtn").classList.toggle("active", tab === 'rate');
      document.getElementById("historyTabBtn").classList.toggle("active", tab === 'history');
      if (tab === 'history') updateHistoryUI();
    }

    // Dynamically generate a real 512x512 PNG icon & valid Manifest matching your exact URL
    (function setupPWA() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2d88ff';
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 280px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('P', 256, 270);

      canvas.toBlob((blob) => {
        const iconUrl = URL.createObjectURL(blob);
        const manifest = {
          name: "Politics Interview Rater",
          short_name: "Politics",
          start_url: window.location.href,
          scope: window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/'),
          display: "standalone",
          background_color: "#18191a",
          theme_color: "#2d88ff",
          icons: [
            { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any" }
          ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(link);
      }, 'image/png');

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    })();

    updateHistoryUI();
  </script>
</body>
</html>
